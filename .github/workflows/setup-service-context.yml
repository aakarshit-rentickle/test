name: Setup Service Context

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_dir:
        required: true
        type: string
      node_version:
        required: true
        type: string
    outputs:
      commit_short:
        description: Short commit hash
        value: ${{ jobs.setup-service-context.outputs.commit_short }}
      service_name:
        description: Service name
        value: ${{ jobs.setup-service-context.outputs.service_name }}
      service_dir:
        description: Service directory
        value: ${{ jobs.setup-service-context.outputs.service_dir }}
      node_version:
        description: Node version
        value: ${{ jobs.setup-service-context.outputs.node_version }}

jobs:
  setup-service-context:
    runs-on: ubuntu-latest
    outputs:
      commit_short: ${{ steps.extract-commit.outputs.commit_short }}
      service_name: ${{ steps.set-context.outputs.service_name }}
      service_dir: ${{ steps.set-context.outputs.service_dir }}
      node_version: ${{ steps.set-context.outputs.node_version }}

    steps:
      - name: Extract short commit hash
        id: extract-commit
        run: |
          commit_short="$(echo '${{ github.event.pull_request.head.sha || github.sha }}' | cut -c1-7)"
          echo "commit_short=$commit_short" >> "$GITHUB_OUTPUT"
          echo "Generated short commit hash: $commit_short"

      - name: Set service context
        id: set-context
        run: |
          echo "service_name=${{ inputs.service_name }}" >> "$GITHUB_OUTPUT"
          echo "service_dir=${{ inputs.service_dir }}" >> "$GITHUB_OUTPUT"
          echo "node_version=${{ inputs.node_version }}" >> "$GITHUB_OUTPUT"
          echo "Generated service context: ${{ inputs.service_name }}, ${{ inputs.service_dir }}, ${{ inputs.node_version }}"
